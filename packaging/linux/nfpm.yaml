# .deb and .rpm of the release's native warp (nfpm, https://nfpm.goreleaser.com/), built by .github/workflows/release.yml:
#   cd <unpacked tarball> && VERSION=1.5.0 ARCH=amd64 nfpm package -f <repo>/packaging/linux/nfpm.yaml -p deb -t <dir>
# Run in the unpacked tarball, the folder that is warp's lib/ with the native warp, its compilers and libwarp_wasmtime
# in it (packaging/native_dist.sh): installed whole as /usr/lib/warp, /usr/bin/warp a link to its warp. ARCH is Go's
# name (amd64, arm64); nfpm writes x86_64/aarch64 into the rpm. notes/packaging.md
name: warp-lang
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: devel
priority: optional
maintainer: pannous <info@pannous.com>
description: |-
  Warp: a data notation that is also a programming language, compiled to WebAssembly GC.
  The native warp, its warp-written compilers and lib/ in /usr/lib/warp.
vendor: pannous
homepage: https://warp.pannous.com/
license: AGPL-3.0-or-later AND MIT # the compiler AGPL, the runtime MIT (CONTRIBUTING.md)
contents:
  - src: ./
    dst: /usr/lib/warp
    type: tree
  - src: /usr/lib/warp/warp
    dst: /usr/bin/warp
    type: symlink

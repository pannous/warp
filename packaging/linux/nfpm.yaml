# .deb and .rpm of the release binaries (nfpm, https://nfpm.goreleaser.com/), built by .github/workflows/release.yml:
#   cd <unpacked tarball> && VERSION=1.3.0 ARCH=amd64 nfpm package -f <repo>/packaging/linux/nfpm.yaml -p deb -t <dir>
# Run in the unpacked tarball: the binaries are read from the current directory. ARCH is Go's name (amd64, arm64);
# nfpm writes x86_64/aarch64 into the rpm. notes/packaging.md
name: warp-lang
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: devel
priority: optional
maintainer: pannous <info@pannous.com>
description: |-
  Warp: a data notation that is also a programming language, compiled to WebAssembly GC.
  Ships warp and warp-runtime, the stub of the standalone executables `warp build` makes, and warp-host.
vendor: pannous
homepage: https://warp.pannous.com/
license: AGPL-3.0-or-later AND MIT # the compiler AGPL, warp-runtime MIT (CONTRIBUTING.md)
contents:
  # warp, warp-runtime, (since the page stub) warp-page-runtime and warp-host: all next to each other; named, so the
  # compilers warp.wasm and warp-self.wasm stay out of /usr/bin
  - src: ./warp
    dst: /usr/bin/warp
    file_info:
      mode: 0755
  - src: ./warp-*runtime
    dst: /usr/bin/
    file_info:
      mode: 0755
  - src: ./warp-host
    dst: /usr/bin/warp-host
    file_info:
      mode: 0755
  # the warp-written compilers and lib/, where warp in /usr/bin finds them (card installed-compilers)
  - src: ./warp*.wasm
    dst: /usr/share/warp/
  # the runtime words every compile links (card release-ships-runtime)
  - src: ./runtime.wasm
    dst: /usr/share/warp/
  - src: ./lib
    dst: /usr/share/warp/lib
    type: tree
  # warp-host's shipped cache, warp-self's kept values (packaging/host_cache.sh, notes/warp_host.md)
  - src: ./host-cache
    dst: /usr/share/warp/host-cache
    type: tree

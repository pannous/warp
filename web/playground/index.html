<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>warp playground</title>
	<script>
		// tasks on Workers need shared memory, which needs cross-origin isolation: a service worker adds the headers
		// GitHub Pages cannot send, then the page reloads once under it (coi-serviceworker.js)
		if (!self.crossOriginIsolated && "serviceWorker" in navigator && !sessionStorage.getItem("isolating")) {
			navigator.serviceWorker.register("coi-serviceworker.js").then(() => {
				sessionStorage.setItem("isolating", "1");
				if (!navigator.serviceWorker.controller) location.reload();
			}, () => {});
		}
	</script>
	<link rel="stylesheet" href="codemirror/codemirror.min.css">
	<link rel="stylesheet" href="playground.css">
	<script src="codemirror/codemirror.min.js"></script>
	<script src="codemirror/codeeditor-simple-mode.js"></script>
	<script src="keywords.js" onerror="window.KEYWORDS = {hard: [], soft: []}"></script>
	<script src="codemirror-wasp-mode.js"></script>
	<script src="examples.js"></script>
	<script src="samples.js" onerror="window.SAMPLES = {}"></script>
	<script src="markup.js"></script>
	<script src="markup-transitions.js"></script>
	<script src="playground.js" defer></script>
	<script src="guide.js" defer></script>
</head>
<body>
<header>
	<h1>🐝 warp <span>playground</span></h1>
	<p class="tagline">wasp, running in your browser</p>
	<a class="source" href="https://github.com/pannous/warp" target="_blank" rel="noopener">source</a>
	<details class="tools">
		<summary title="more">⋯</summary>
		<div class="tools-menu">
			<p>Run it on your machine: <code>warp hello.wasp</code> (<a href="https://github.com/pannous/warp#install--run" target="_blank" rel="noopener">get warp</a>)</p>
			<p><button id="download" title="the WebAssembly module of the last run">⤓ download the wasm</button></p>
			<p><a id="build" class="build"></a></p>
			<div id="silenced" class="silenced" hidden>
				<p>Silenced hints:</p>
				<ul id="acknowledged"></ul>
			</div>
		</div>
	</details>
</header>
<main>
	<details id="guide" class="guide-pane" open>
		<summary>guide</summary>
		<div id="guide-chapters" class="guide-chapters">loading the guide…</div>
	</details>
	<div id="guide-resizer" class="resizer columns" role="separator" aria-orientation="vertical" aria-label="guide width" tabindex="0" title="drag to resize, double-click to reset"></div>
	<div class="workspace">
		<nav class="toolbar">
			<select id="examples" aria-label="example"></select>
			<button id="run" title="Ctrl/Cmd-Enter">Run ▶</button>
			<label><input id="auto" type="checkbox" checked> run while typing</label>
			<a id="guide-link" class="guide-link" hidden></a>
		</nav>
		<section class="editor-pane"><textarea id="code" spellcheck="false"></textarea></section>
		<div id="editor-resizer" class="resizer rows" role="separator" aria-orientation="horizontal" aria-label="editor height" tabindex="0" title="drag to resize, double-click to reset"></div>
		<section id="output" class="output-pane" tabindex="0">
			<span id="status" class="status">loading the compiler…</span>
			<div id="listening" class="listening-note" hidden></div>
			<div class="result"><span class="prompt">»</span> <output id="value"></output></div>
			<pre id="printed" class="printed" hidden></pre>
			<input id="address" class="address" hidden spellcheck="false" aria-label="page path" title="the page's path: type one and press Enter">
			<div id="rendered" class="rendered" hidden></div>
			<div id="paintings" class="paintings"></div>
			<ul id="diagnostics" class="diagnostics"></ul>
		</section>
	</div>
</main>
</body>
</html>

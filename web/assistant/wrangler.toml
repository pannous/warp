# warp-assistant, the playground assistant's proxy for visitors without a key (assistant.mjs, card assistant-proxy)
# Secrets (wrangler secret put …): ANTHROPIC_API_KEY, TURNSTILE_SECRET, SESSION_SECRET. Deploy: wrangler deploy (here)
name = "warp-assistant"
main = "assistant.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PLAYGROUND_ORIGIN = "https://warp.pannous.com" # the only Origin answered; its guides are read from there too

# per visitor address: completion asks at most once a second of paused typing
[[ratelimits]]
name = "PER_ADDRESS"
namespace_id = "1101"
simple = { limit = 20, period = 60 }

# Running compiled warp programs without the compiler (notes/aot.md): the engine settings and host words warp links
# for its own runs, and the binary `warp-runtime`, the prebuilt stub `warp build` appends a program's machine
# code to. Built on its own (`cargo build --release -p warp-runtime`) it is wasmtime without Cranelift, about 1 MB.
[package]
name = "warp-runtime"
version = "1.2.5"
edition = "2021"
description = "Runs compiled Warp programs without the compiler: the stub of Warp's standalone executables"
repository = "https://github.com/pannous/warp"
homepage = "https://warp.pannous.com/"

[[bin]]
name = "warp-runtime"
path = "src/main.rs"
required-features = ["engine"]

[features]
default = ["engine"]
# running modules: wasmtime's runtime and GC, the host words; without it only the names of the host words
engine = ["dep:wasmtime", "dep:miniz_oxide"]
# compiling modules too (warp itself): Cranelift and its settings; warp's wasmtime has the component model (through
# wasmtime-wasi), which its engines turn off
compiler = ["engine", "wasmtime/cranelift", "wasmtime/component-model"]

[dependencies]
miniz_oxide = { version = "0.9", optional = true } # the carried machine code is deflated (standalone.rs)
wasmtime = { version = "49.0.1", default-features = false, features = ["anyhow", "gc", "gc-copying", "runtime", "std"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2" # the SIGINT handler of `on interrupt` (host_words.rs signal_poll); in the tree through wasmtime already

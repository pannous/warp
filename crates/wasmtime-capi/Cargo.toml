# warp's wasmtime C API (card wasmtime-bundled, notes/native_rebuild_speed.md): wasmtime's own C API with the copying
# collector, which Collector::Auto then picks, and the setters its C API lacks. The native warp (core/native/driver.warp)
# and built executables load it beside warp as libwarp_wasmtime (@rpath). Its own workspace: wasmtime 50 here, the
# harness's 49 elsewhere. Built by scripts/wasmtime-c-api.sh, locally and per platform by .github/workflows/release.yml
[package]
name = "warp-wasmtime"
version = "50.0.0"
edition = "2024"
# wasmtime 50's own minimum: the lock file stays buildable by CI's stable toolchain
rust-version = "1.97"
publish = false

[lib]
name = "warp_wasmtime"
crate-type = ["cdylib"]

[dependencies]
wasmtime-c-api = { version = "=50.0.0", package = "wasmtime-c-api-impl", default-features = false, features = ["wasi", "cache", "parallel-compilation", "gc", "gc-drc", "gc-copying", "cranelift"] }
wasmtime = { version = "=50.0.0", default-features = false }

# tests/subtype_display.rs writes its module as text
[dev-dependencies]
wasmtime = { version = "=50.0.0", default-features = false, features = ["wat", "gc", "gc-drc", "cranelift", "runtime"] }

# wasmtime with warp's patches (patches/), unpacked and patched by scripts/wasmtime-c-api.sh: a copying heap grows
# once half of its active half is live (patches/copying-heap-growth.patch); ref.test and ref.cast test a subtype
# inline against the store's subtype display (patches/subtype-display.patch, card subtype-inline)
[patch.crates-io]
wasmtime = { path = "patched/wasmtime" }
wasmtime-environ = { path = "patched/wasmtime-environ" }
wasmtime-internal-cranelift = { path = "patched/wasmtime-internal-cranelift" }

[profile.release]
strip = "debuginfo"

[workspace]

# .github/workflows/release.yml
name: Release

# A version tag (v*, matching Cargo.toml's version) publishes a GitHub release of the native warp (decision
# rust-gone-in-1-5: no Rust binary shipped): per platform one tarball, a folder that is warp's lib/ with the compilers
# warp.wasm, runtime.wasm, warp-self.wasm and modules/ in it, the native warp (core/native/warp.warp built by
# `warp build native`) and our libwarp_wasmtime beside it (packaging/native_dist.sh). The Homebrew formula
# (packaging/homebrew/Formula/warp.rb, copied to pannous/homebrew-tap) installs it; .deb and .rpm (warp-lang) repackage
# it; notes/packaging.md. A dry run (workflow_dispatch, dry) builds and gates everything and publishes nothing.
# Bootstrap: warp from warp. The previous release's native warp (its tarball for the runner's platform), rebuilt from the
# tag's core/native first (scripts/release-bootstrap.sh), runs the seed that builds the compilers, and builds the new
# native warp with them; no Rust but our wasmtime C API (cargo).
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag (or, for a dry run, any ref) to build the release of
        required: true
      repackage:
        description: only the packages (deb, rpm) from the release's existing tarballs, which keep their sha256
        type: boolean
        default: false
      dry:
        description: build and gate the tarballs as workflow artifacts, publish nothing
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: false
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY: ${{ inputs.dry && '1' || '' }}
  WABT: 1.0.42     # wasm2c, which `warp build native` runs
  BINARYEN: 133    # wasm-opt, which `warp build` runs
  WARP_NO_WINDOW: 1
  WARP_HINTS: 0

permissions:
  contents: write

jobs:
  release:
    if: ${{ !inputs.repackage && !inputs.dry }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: create the release (once)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --notes-file "notes/releases/$TAG.md" --title "warp $TAG"

  compilers:
    # warp.wasm built from the tag's lib/ by the seed (the newest seed-* release's asset, scripts/refresh-seed.sh),
    # runtime.wasm and modules/ beside it, warp-self.wasm promoted when warp.wasm compiles compiler.warp once more
    needs: release
    if: ${{ !cancelled() && !inputs.repackage }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      WARP_TIME_LIMIT: 900
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
    - uses: actions/checkout@v7 # the workflow's own commit, whose release-bootstrap.sh fits any older tag
      with:
        path: .workflow
    - name: wabt and binaryen
      # the bootstrap's `warp build native` runs wasm2c, the rebuild optimizes warp.wasm with wasm-opt, as locally
      run: |
        gh release download "version_$BINARYEN" --repo WebAssembly/binaryen --pattern "binaryen-version_$BINARYEN-x86_64-linux.tar.gz"
        tar -xzf "binaryen-version_$BINARYEN-x86_64-linux.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_$BINARYEN/bin" >>"$GITHUB_PATH"
        gh release download "$WABT" --repo WebAssembly/wabt --pattern "wabt-$WABT-linux-x64.tar.gz"
        tar -xzf "wabt-$WABT-linux-x64.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/wabt-$WABT/bin" >>"$GITHUB_PATH"
    - name: the previous release's native warp, brought up to the tag's host words
      run: .workflow/scripts/release-bootstrap.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/bootstrap" .
    - name: build
      run: |
        seed=$(gh release list --repo pannous/warp --limit 100 --json tagName -q '[.[] | select(.tagName | startswith("seed-"))][0].tagName')
        gh release download "$seed" --repo pannous/warp --pattern warp-seed.wasm --dir "$RUNNER_TEMP/bootstrap" --clobber
        export WARP_LIB=$PWD/lib
        "$RUNNER_TEMP/bootstrap/warp" rebuild pure
        "$RUNNER_TEMP/bootstrap/warp" rebuild self
        "$RUNNER_TEMP/bootstrap/warp" samples/hello/hello.warp | grep Hello
    - uses: actions/upload-artifact@v7
      with:
        name: compilers
        path: |
          lib/warp.wasm
          lib/runtime.wasm
          lib/warp-self.wasm
          lib/modules/*.wasm

  native:
    needs: compilers
    if: ${{ !cancelled() && needs.compilers.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-latest, target: aarch64-apple-darwin, wabt: macos-arm64, binaryen: arm64-macos, library: libwarp_wasmtime.dylib }
        - { os: macos-15-intel, target: x86_64-apple-darwin, wabt: brew, binaryen: x86_64-macos, library: libwarp_wasmtime.dylib }
        # pinned: the runner's glibc is the oldest the binaries run on
        - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, wabt: linux-x64, binaryen: x86_64-linux, library: libwarp_wasmtime.so }
        - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, wabt: linux-arm64, binaryen: aarch64-linux, library: libwarp_wasmtime.so }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE: warp-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
    - uses: actions/checkout@v7 # the workflow's own commit, whose release-bootstrap.sh fits any older tag
      with:
        path: .workflow
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/download-artifact@v8
      with:
        name: compilers
        path: lib
    - name: wabt and binaryen
      # `warp build native` runs the wasm2c on the PATH, with the runtime and headers of its prefix; `warp build` the
      # wasm-opt that trims a program's module
      run: |
        gh release download "version_$BINARYEN" --repo WebAssembly/binaryen --pattern "binaryen-version_$BINARYEN-${{ matrix.binaryen }}.tar.gz"
        tar -xzf "binaryen-version_$BINARYEN-${{ matrix.binaryen }}.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_$BINARYEN/bin" >>"$GITHUB_PATH"
        if [ "$RUNNER_OS" = macOS ]; then # the gate's scripts run GNU timeout, macOS has none
          brew install coreutils && mkdir -p "$RUNNER_TEMP/gnu" && ln -s "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/gnu/timeout"
          echo "$RUNNER_TEMP/gnu" >>"$GITHUB_PATH"
        fi
        if [ "${{ matrix.wabt }}" = brew ]; then brew install wabt; exit; fi
        gh release download "$WABT" --repo WebAssembly/wabt --pattern "wabt-$WABT-${{ matrix.wabt }}.tar.gz"
        tar -xzf "wabt-$WABT-${{ matrix.wabt }}.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/wabt-$WABT/bin" >>"$GITHUB_PATH"
    - name: our wasmtime C API and sound library
      # the copying collector and the GC setters wasmtime's own lacks (card wasmtime-bundled), and libwarp_sound
      # (miniaudio, decision sound-plays), in lib/, where `warp build native` links from and the native warp finds
      # them beside itself
      run: |
        WARP_WASMTIME_TARGET=$PWD/crates/wasmtime-capi/target WARP_SOUND_TARGET="$RUNNER_TEMP/warp-sound" \
          WARP_GPU_TARGET="$RUNNER_TEMP/warp-gpu" WARP_WINDOW_TARGET="$RUNNER_TEMP/warp-window" scripts/wasmtime-c-api.sh lib
    - name: the previous release's native warp, brought up to the tag's host words
      run: .workflow/scripts/release-bootstrap.sh ${{ matrix.target }} "$RUNNER_TEMP/bootstrap" .
    - name: the native warp
      run: WARP_LIB=$PWD/lib "$RUNNER_TEMP/bootstrap/warp" build native core/native/warp.warp
    - name: the release folder, gated
      run: |
        packaging/native_dist.sh dist
        tar -czf "$ARCHIVE" -C dist .
    - uses: actions/upload-artifact@v7
      with:
        name: tarball-${{ matrix.target }}
        path: ${{ env.ARCHIVE }}
    - name: upload
      if: ${{ !inputs.dry }}
      run: gh release upload "$TAG" "$ARCHIVE" --clobber

  packages:
    # the linux tarballs repackaged as .deb and .rpm of warp-lang, attached to the release
    needs: native
    if: ${{ !cancelled() && !inputs.dry && contains(fromJSON('["success", "skipped"]'), needs.native.result) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NFPM: https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
    steps:
    - uses: actions/checkout@v7 # the workflow's own commit (the tag, on a tag push), with its packaging/ files
    - name: deb and rpm
      run: |
        gh release download "$TAG" -p 'warp-*linux-gnu.tar.gz' -D dist/tarballs
        curl -sSfL "$NFPM" | sudo tar -xz -C /usr/local/bin nfpm
        mkdir -p dist/linux # nfpm writes a file of that name when the directory is missing
        for arch in x86_64:amd64 aarch64:arm64; do
          target=${arch%:*}-unknown-linux-gnu
          mkdir -p "dist/$target"
          tar -xzf "dist/tarballs/warp-$TAG-$target.tar.gz" -C "dist/$target"
          for format in deb rpm; do
            (cd "dist/$target" && VERSION=${TAG#v} ARCH=${arch#*:} nfpm package -f "$GITHUB_WORKSPACE/packaging/linux/nfpm.yaml" -p "$format" -t "$GITHUB_WORKSPACE/dist/linux")
          done
        done
    - name: check the amd64 .deb
      run: |
        sudo dpkg -i dist/linux/warp-lang_*_amd64.deb
        (cd "$RUNNER_TEMP" && warp '6*7' | grep -q 42)
    - name: upload
      run: gh release upload "$TAG" dist/linux/* --clobber

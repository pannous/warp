# .github/workflows/release.yml
name: Release

# A version tag (v*, matching Cargo.toml's version) publishes a GitHub release with prebuilt binaries: per platform one
# tarball holding `warp`, `warp-runtime` (the stub `warp build --exe` needs next to warp) and `warp-page-runtime` (the
# stub of page apps, with the web view). The Homebrew formula
# (packaging/homebrew/Formula/warp.rb, copied to pannous/homebrew-tap) installs these binaries (no Rust build); its
# --HEAD install builds main from source. Then the tarballs are repackaged: PyPI wheels (warp-language), .deb and .rpm
# (warp-lang) on the release, the AUR's warp-lang-bin; notes/packaging.md
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)build the binaries for
        required: true
      repackage:
        description: only the packages (wheels, deb, rpm, AUR) from the release's existing tarballs, which keep their sha256
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: false
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    if: ${{ !inputs.repackage }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: create the release (once)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "warp $TAG"

  binaries:
    needs: release
    if: ${{ !inputs.repackage }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-latest, target: aarch64-apple-darwin }
        - { os: macos-latest, target: x86_64-apple-darwin }
        # pinned: the runner's glibc is the oldest the binaries run on (ubuntu-latest becomes 26.04, glibc 2.43)
        - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
        - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: build
      # three builds: built on its own, warp-runtime has no Cranelift (about 1 MB); the page stub adds the web view
      run: |
        cargo build --release --locked --target ${{ matrix.target }}
        cargo build --release --locked --target ${{ matrix.target }} -p warp-runtime --features webview --bin warp-page-runtime
        cargo build --release --locked --target ${{ matrix.target }} -p warp-runtime --bin warp-runtime
    - name: upload
      env:
        GH_TOKEN: ${{ github.token }}
        ARCHIVE: warp-${{ env.TAG }}-${{ matrix.target }}.tar.gz
      run: |
        tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release warp warp-runtime warp-page-runtime
        gh release upload "$TAG" "$ARCHIVE" --clobber

  packages:
    # the tarballs repackaged: PyPI wheels of warp-language, .deb and .rpm of warp-lang, all attached to the release
    needs: binaries
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.binaries.result) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NFPM: https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
    steps:
    - uses: actions/checkout@v7 # the workflow's own commit (the tag, on a tag push), with its packaging/ files
    - name: wheels
      run: |
        gh release download "$TAG" -p 'warp-*.tar.gz' -D dist/tarballs
        python3 packaging/pypi/build_wheels.py "${TAG#v}" dist/tarballs dist/wheels
    - name: deb and rpm
      run: |
        curl -sSfL "$NFPM" | sudo tar -xz -C /usr/local/bin nfpm
        mkdir -p dist/linux # nfpm writes a file of that name when the directory is missing
        for arch in x86_64:amd64 aarch64:arm64; do
          target=${arch%:*}-unknown-linux-gnu
          mkdir -p "dist/$target"
          tar -xzf "dist/tarballs/warp-$TAG-$target.tar.gz" -C "dist/$target"
          for format in deb rpm; do
            (cd "dist/$target" && VERSION=${TAG#v} ARCH=${arch#*:} nfpm package -f "$GITHUB_WORKSPACE/packaging/linux/nfpm.yaml" -p "$format" -t "$GITHUB_WORKSPACE/dist/linux")
          done
        done
    - name: check the amd64 .deb and wheel
      run: |
        sudo dpkg -i dist/linux/warp-lang_*_amd64.deb
        warp eval '6*7' | grep -q 42
        pip install --no-deps --break-system-packages --target "$RUNNER_TEMP/pip" dist/wheels/*manylinux*_x86_64.whl
        "$RUNNER_TEMP/pip/bin/warp" eval '6*7' | grep -q 42
    - name: upload
      run: gh release upload "$TAG" dist/wheels/*.whl dist/linux/* --clobber
    - uses: actions/upload-artifact@v7
      with:
        name: wheels
        path: dist/wheels

  pypi:
    # trusted publishing: no token, PyPI trusts this workflow (one-time setup in notes/packaging.md, then the repository
    # variable PYPI_PUBLISH=true turns this job on)
    needs: packages
    # !cancelled(): a repackage run skips binaries, and a skipped ancestor would skip this job too
    if: ${{ !cancelled() && needs.packages.result == 'success' && vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: wheels
        path: dist/wheels
    - uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        packages-dir: dist/wheels
        skip-existing: true

  aur:
    # warp-lang-bin: PKGBUILD and .SRCINFO for this tag, checked by makepkg (built, installed, run), pushed to the AUR
    # when the secret AUR_SSH_KEY holds the key registered there (notes/packaging.md)
    needs: binaries
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.binaries.result) }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
    - run: pacman -Syu --noconfirm --needed git github-cli openssh
    - uses: actions/checkout@v7
    - name: PKGBUILD and .SRCINFO
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        packaging/aur/update_aur.sh "${TAG#v}"
    - name: makepkg
      # makepkg refuses root
      run: |
        useradd -m builder
        cp -r packaging/aur /home/builder/aur
        chown -R builder /home/builder/aur
        su builder -c 'cd ~/aur && makepkg --printsrcinfo | diff - .SRCINFO && makepkg --noconfirm'
        pacman -U --noconfirm /home/builder/aur/warp-lang-bin-*.pkg.tar.zst
        warp eval '6*7' | grep -q 42
    - name: push to the AUR
      if: env.AUR_SSH_KEY != ''
      run: |
        # in the container $HOME (/github/home) is not the home ssh reads (/root), so the key and host are named here
        echo "$AUR_SSH_KEY" > "$RUNNER_TEMP/aur"
        chmod 600 "$RUNNER_TEMP/aur"
        ssh-keyscan aur.archlinux.org > "$RUNNER_TEMP/known_hosts"
        export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o IdentitiesOnly=yes"
        git config --global user.name pannous
        git config --global user.email info@pannous.com
        packaging/aur/update_aur.sh "${TAG#v}" --push

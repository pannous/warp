# .github/workflows/release.yml
name: Release

# A version tag (v*, matching Cargo.toml's version) publishes a GitHub release of the native warp (decision
# rust-gone-in-1-5: no Rust binary shipped): per platform one tarball, a folder that is warp's lib/ with the compilers
# warp.wasm, runtime.wasm, warp-self.wasm and modules/ in it, the native warp (core/native/warp.warp built by
# `warp build native`) and our libwarp_wasmtime beside it (packaging/native_dist.sh). The Homebrew formula
# (packaging/homebrew/Formula/warp.rb, copied to pannous/homebrew-tap) installs it; .deb and .rpm (warp-lang) repackage
# it; notes/packaging.md. A dry run (workflow_dispatch, dry) builds and gates everything and publishes nothing.
# Bootstrap: warp from warp. The previous release's native warp (its tarball for the runner's platform), rebuilt from the
# tag's core/native first (scripts/release-bootstrap.sh), runs the seed that builds the compilers, and builds the new
# native warp with them; no Rust but our wasmtime C API (cargo).
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag (or, for a dry run, any ref) to build the release of
        required: true
      repackage:
        description: only the packages (deb, rpm) from the release's existing tarballs, which keep their sha256
        type: boolean
        default: false
      dry:
        description: build and gate the tarballs as workflow artifacts, publish nothing
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: false
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY: ${{ inputs.dry && '1' || '' }}
  WABT: 1.0.42     # wasm2c, which `warp build native` runs
  LLVM_MINGW: 20261104 # clang for Windows, which compiles the first Windows warp's C (card windows-build)
  BINARYEN: 133    # wasm-opt, which `warp build` runs
  WARP_WINDOW: 0
  GLIBC_FLOOR: 2.35 # the oldest glibc the linux binaries run on (card linux-glibc-floor)

permissions:
  contents: write

jobs:
  release:
    if: ${{ !inputs.repackage && !inputs.dry }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: create the release (once)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --notes-file "notes/releases/$TAG.md" --title "warp $TAG"

  compilers:
    # warp.wasm built from the tag's lib/ by the seed (the newest seed-* release's asset, scripts/refresh-seed.sh),
    # runtime.wasm and modules/ beside it, warp-self.wasm promoted when warp.wasm compiles compiler.warp once more
    needs: release
    if: ${{ !cancelled() && !inputs.repackage }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
    - uses: actions/checkout@v7 # the workflow's own commit, whose release-bootstrap.sh fits any older tag
      with:
        path: .workflow
    - name: our wasmtime C API
      # the tag's, which the tag's native warp built in the next step calls (scripts/ci-compilers.sh)
      run: WARP_WASMTIME_TARGET=$PWD/crates/wasmtime-capi/target WARP_GPU_TARGET="$RUNNER_TEMP/warp-gpu" scripts/wasmtime-c-api.sh lib
    - name: build
      # wabt and binaryen, the previous release's native warp brought up to the tag's host words, the newest seed
      run: .workflow/scripts/ci-compilers.sh . "$RUNNER_TEMP/bootstrap"
    - name: self test
      run: |
        "$RUNNER_TEMP/bootstrap/warp" --lib "$PWD/lib" rebuild self
        "$RUNNER_TEMP/bootstrap/warp" --lib "$PWD/lib" samples/hello/hello.warp | grep Hello
    - name: the native warp's C, for Windows
      # no warp runs on Windows yet to build the native warp there: its C is made here (card windows-build)
      run: cd core/native && "$RUNNER_TEMP/bootstrap/warp" --lib "$GITHUB_WORKSPACE/lib" build native --c warp.warp
    - uses: actions/upload-artifact@v7
      with:
        name: windows-c
        path: core/native/warp.native.*
    - uses: actions/upload-artifact@v7
      with:
        name: compilers
        path: |
          lib/warp.wasm
          lib/runtime.wasm
          lib/warp-self.wasm
          lib/modules/*.wasm

  native:
    needs: compilers
    if: ${{ !cancelled() && needs.compilers.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-latest, target: aarch64-apple-darwin, wabt: macos-arm64, binaryen: arm64-macos, library: libwarp_wasmtime.dylib }
        - { os: macos-15-intel, target: x86_64-apple-darwin, wabt: brew, binaryen: x86_64-macos, library: libwarp_wasmtime.dylib }
        # pinned: the runner's glibc is the oldest the binaries run on (card linux-glibc-floor): 22.04's 2.35, so
        # Ubuntu 22.04, Debian 12 and their kin run them; the previous release's warp, which bootstraps, asks only 2.34
        - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, wabt: linux-x64, binaryen: x86_64-linux, library: libwarp_wasmtime.so }
        - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, wabt: linux-arm64, binaryen: aarch64-linux, library: libwarp_wasmtime.so }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE: warp-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
    - uses: actions/checkout@v7 # the workflow's own commit, whose release-bootstrap.sh fits any older tag
      with:
        path: .workflow
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/download-artifact@v8
      with:
        name: compilers
        path: lib
    - name: wabt and binaryen
      # `warp build native` runs the wasm2c on the PATH, with the runtime and headers of its prefix; `warp build` the
      # wasm-opt that trims a program's module
      run: |
        gh release download "version_$BINARYEN" --repo WebAssembly/binaryen --pattern "binaryen-version_$BINARYEN-${{ matrix.binaryen }}.tar.gz"
        tar -xzf "binaryen-version_$BINARYEN-${{ matrix.binaryen }}.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_$BINARYEN/bin" >>"$GITHUB_PATH"
        if [ "$RUNNER_OS" = macOS ]; then # the gate's scripts run GNU timeout, macOS has none
          brew install coreutils && mkdir -p "$RUNNER_TEMP/gnu" && ln -s "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/gnu/timeout"
          echo "$RUNNER_TEMP/gnu" >>"$GITHUB_PATH"
        fi
        if [ "${{ matrix.wabt }}" = brew ]; then brew install wabt; exit; fi
        gh release download "$WABT" --repo WebAssembly/wabt --pattern "wabt-$WABT-${{ matrix.wabt }}.tar.gz"
        tar -xzf "wabt-$WABT-${{ matrix.wabt }}.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/wabt-$WABT/bin" >>"$GITHUB_PATH"
    - name: our wasmtime C API and native libraries
      # the copying collector and the GC setters wasmtime's own lacks (card wasmtime-bundled), and libwgpu_native, in lib/,
      # where `warp build native` links from and the native warp finds them beside itself
      run: |
        WARP_WASMTIME_TARGET=$PWD/crates/wasmtime-capi/target WARP_GPU_TARGET="$RUNNER_TEMP/warp-gpu" scripts/wasmtime-c-api.sh lib
    - name: the previous release's native warp, brought up to the tag's host words
      run: .workflow/scripts/release-bootstrap.sh ${{ matrix.target }} "$RUNNER_TEMP/bootstrap" .
    - name: the native warp
      run: '"$RUNNER_TEMP/bootstrap/warp" --lib "$PWD/lib" build native core/native/warp.warp'
    - name: the glibc floor
      # no binary or library may ask a glibc newer than the promised floor (notes/packaging.md), whatever the runner;
      # weak symbols (Rust std's pidfd_*) bind to none
      if: ${{ runner.os == 'Linux' }}
      run: |
        floor=$GLIBC_FLOOR
        for f in core/native/warp lib/*.so; do
          newest=$(objdump -T "$f" | grep -v ' w ' | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "$f: glibc $newest (floor $floor)"
          [ "$(printf '%s\n%s\n' "$newest" "$floor" | sort -V | tail -1)" = "$floor" ]
        done
    - name: the release folder, gated
      run: |
        packaging/native_dist.sh dist
        tar -czf "$ARCHIVE" -C dist .
    - uses: actions/upload-artifact@v7
      with:
        name: tarball-${{ matrix.target }}
        path: ${{ env.ARCHIVE }}
    - name: upload
      if: ${{ !inputs.dry }}
      run: gh release upload "$TAG" "$ARCHIVE" --clobber

  windows:
    # the native warp on Windows (card windows-build): the compilers job's C of core/native/warp.warp compiled by
    # llvm-mingw's clang against our wasmtime C API, lib/native/windows.c answering its POSIX calls; hello and smoke's
    # checks, a `warp test` file, a native build; the release folder (packaging/native_dist.sh) as a zip
    needs: compilers
    if: ${{ !cancelled() && needs.compilers.result == 'success' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE: warp-${{ inputs.tag || github.ref_name }}-x86_64-pc-windows-gnu.zip
    steps:
    # the sources as written, LF: Git for Windows checks text out with CRLF (card crlf-line-endings)
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/download-artifact@v8
      with:
        name: compilers
        path: lib
    - uses: actions/download-artifact@v8
      with:
        name: windows-c
        path: core/native
    - name: wabt and llvm-mingw
      # wasm2c's runtime and headers, and clang
      run: |
        mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
        gh release download "$WABT" --repo WebAssembly/wabt --pattern "wabt-$WABT-windows-x64.tar.gz"
        tar -xzf "wabt-$WABT-windows-x64.tar.gz"
        gh release download "$LLVM_MINGW" --repo mstorsjo/llvm-mingw --pattern "llvm-mingw-$LLVM_MINGW-ucrt-x86_64.zip"
        unzip -q "llvm-mingw-$LLVM_MINGW-ucrt-x86_64.zip"
        echo "$PWD/wabt-$WABT/bin" >>"$GITHUB_PATH"
        echo "$PWD/llvm-mingw-$LLVM_MINGW-ucrt-x86_64/bin" >>"$GITHUB_PATH"
    - name: our wasmtime C API and native libraries
      # with wgpu-native's and SDL3's DLLs for the window, the sound and the GPU
      run: WARP_WASMTIME_TARGET=$PWD/crates/wasmtime-capi/target WARP_GPU_TARGET="$RUNNER_TEMP/warp-gpu" scripts/wasmtime-c-api.sh lib
    - name: the native warp
      # as `warp build native` links on macOS and Linux (extensions/commands/build.warp): the main thread's stack from
      # the linker, the executable's own C functions exported for the lookup by name
      run: |
        wabt=$RUNNER_TEMP/tools/wabt-$WABT
        runtime=$wabt/share/wabt/wasm2c
        clang -O2 -I"$runtime" -I"$wabt/include" -Ilib -o lib/warp.exe core/native/warp.native.c core/native/warp.native.main.c \
          "$runtime/wasm-rt-impl.c" "$runtime/wasm-rt-mem-impl.c" crates/wasmtime-capi/target/release/warp_wasmtime.dll.lib \
          -static -pthread -Wl,--export-all-symbols -Wl,--stack,0x10000000
    - name: hello and smoke
      # scripts/smoke.sh's checks of a built warp: hello, and the native host module answering
      run: |
        lib/warp.exe --version
        lib/warp.exe samples/hello/hello.warp | grep Hello
        [ "$(lib/warp.exe 'window_possible()')" = no ]
        # warp test's slots, children and files: the cases started anew by posix_spawnp, as Windows has no fork
        lib/warp.exe test test/modules/test_exec_sh_runs.pairs.warp
        # wgpu-native on the runner's adapter (no GPU there: DirectX's software one), a compute shader's list read back
        lib/warp.exe "$(sed -n 3p test/gpu/test_gpu_compute_in_place.pairs.warp | cut -f1 | sed "s/^'//;s/'$//")" | tee gpu.txt
        grep -qx '\[0, 2, 4, 6\]' gpu.txt
    - name: a native build
      # warp build native on Windows: wasm2c and clang from the PATH, the program's C functions and WASI by lib/native
      run: |
        lib/warp.exe build native samples/native/files.warp
        cd samples/native && [ "$(./files)" = "Hello from a file" ]
    - name: the release folder, gated, zipped
      run: |
        packaging/native_dist.sh dist lib/warp.exe
        (cd dist && 7z a -tzip -bd "../$ARCHIVE" . >/dev/null)
    - uses: actions/upload-artifact@v7
      with:
        name: zip-windows
        path: ${{ env.ARCHIVE }}
    - name: the scoop manifest
      # packaging/scoop/warp.json with this release's version and the zip's sha256: `scoop install
      # https://github.com/pannous/warp/releases/latest/download/warp.json`
      run: |
        hash=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
        sed -e "s/VERSION/${TAG#v}/g" -e "s/HASH/$hash/" packaging/scoop/warp.json >warp.json
        cat warp.json
    - name: installed by scoop, run from PowerShell
      # the manifest pointed at the zip built here; no POSIX shell around, so HOME comes from USERPROFILE (windows.c)
      shell: pwsh
      run: |
        Invoke-RestMethod get.scoop.sh -OutFile install-scoop.ps1
        .\install-scoop.ps1 -RunAsAdmin
        $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
        $manifest = Get-Content warp.json | ConvertFrom-Json
        $manifest.url = (Resolve-Path $env:ARCHIVE).Path
        $manifest | ConvertTo-Json -Depth 5 | Set-Content local-warp.json
        scoop install .\local-warp.json
        Remove-Item Env:HOME -ErrorAction Ignore
        $hello = warp samples/hello/hello.warp
        $hello
        if ("$hello" -notmatch "Hello") { exit 1 }
    - name: upload
      if: ${{ !inputs.dry }}
      run: gh release upload "$TAG" "$ARCHIVE" warp.json --clobber

  packages:
    # the tarballs repackaged: PyPI wheels of warp-language, .deb and .rpm of warp-lang, attached to the release
    needs: native
    if: ${{ !cancelled() && !inputs.dry && contains(fromJSON('["success", "skipped"]'), needs.native.result) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NFPM: https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
    steps:
    - uses: actions/checkout@v7 # the workflow's own commit (the tag, on a tag push), with its packaging/ files
    - name: wheels
      run: |
        gh release download "$TAG" -p 'warp-*.tar.gz' -D dist/tarballs
        python3 packaging/pypi/build_wheels.py "${TAG#v}" dist/tarballs dist/wheels
    - name: deb and rpm
      run: |
        curl -sSfL "$NFPM" | sudo tar -xz -C /usr/local/bin nfpm
        mkdir -p dist/linux # nfpm writes a file of that name when the directory is missing
        for arch in x86_64:amd64 aarch64:arm64; do
          target=${arch%:*}-unknown-linux-gnu
          mkdir -p "dist/$target"
          tar -xzf "dist/tarballs/warp-$TAG-$target.tar.gz" -C "dist/$target"
          for format in deb rpm; do
            (cd "dist/$target" && VERSION=${TAG#v} ARCH=${arch#*:} nfpm package -f "$GITHUB_WORKSPACE/packaging/linux/nfpm.yaml" -p "$format" -t "$GITHUB_WORKSPACE/dist/linux")
          done
        done
    - name: check the amd64 .deb and wheel
      run: |
        sudo dpkg -i dist/linux/warp-lang_*_amd64.deb
        (cd "$RUNNER_TEMP" && warp '6*7' | grep -q 42)
        pip install --no-deps --break-system-packages --prefix "$RUNNER_TEMP/pip" dist/wheels/*manylinux*_x86_64.whl
        # Debian's pip puts a --prefix install's scripts in <prefix>/local/bin, others in <prefix>/bin
        pip_warp=$(find "$RUNNER_TEMP/pip" -path '*/bin/warp' -type f | head -1)
        (cd "$RUNNER_TEMP" && "${pip_warp:?the wheel installed no bin/warp}" '6*7' | grep -q 42)
    - name: upload
      run: gh release upload "$TAG" dist/linux/* --clobber
    - uses: actions/upload-artifact@v7
      with:
        name: wheels
        path: dist/wheels

  pypi:
    # trusted publishing: no token, PyPI trusts this workflow (one-time setup in notes/packaging.md, then the repository
    # variable PYPI_PUBLISH=true turns this job on)
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' && vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: wheels
        path: dist/wheels
    - uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        packages-dir: dist/wheels
        skip-existing: true

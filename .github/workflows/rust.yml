# .github/workflows/rust.yml
name: Rust CI

# The tests do not run on every push to main (user decision 2026-10-03: the failure mails were noise). They run
# nightly when main changed, by hand (`gh workflow run "Rust CI" -R pannous/warp [--ref <branch>]`), on a version tag
# (v*), and on a push whose head commit message contains [ci]. claude/* branches (cloud agents) always run.
on:
  push:
    branches: [ main, "claude/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: false
  LEAN_TOOLCHAIN: leanprover/lean4:v4.34.1
  NIGHTLY_WINDOW: 25 hours ago

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    - id: decide
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        run=false
        case "$EVENT" in
          workflow_dispatch|pull_request) run=true ;;
          schedule) [ -n "$(git log --since="$NIGHTLY_WINDOW" --format=%h)" ] && run=true ;;
          push)
            case "$REF" in refs/heads/claude/*|refs/tags/*) run=true ;; esac
            case "$MESSAGE" in *"[ci]"*) run=true ;; esac ;;
        esac
        echo "run=$run" >> "$GITHUB_OUTPUT"
        echo "tests run: $run ($EVENT $REF)" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - uses: actions/cache@v4
      with:
        path: ~/.elan
        key: ${{ runner.os }}-elan-${{ env.LEAN_TOOLCHAIN }}
    - name: Install Lean (law proofs)
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain $LEAN_TOOLCHAIN
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
    # claude/* branches are the cloud agents' build farm (their sandboxes cannot reach crates.io):
    # a red build there is expected mid-work and belongs to the agent, so it must not fail the job
    # and mail the maintainer. The real outcome is reported to the agent in the last step.
    - id: build
      run: cargo build --verbose
      continue-on-error: ${{ startsWith(github.ref, 'refs/heads/claude/') }}
    # Zero warnings: -D warnings on the crate itself only (cargo rustc), so the dependencies stay cached.
    # Default (native), all features, the browser build without native, and the test binary.
    - id: warnings
      run: |
        cargo rustc --lib -- -D warnings
        cargo rustc --bin warp -- -D warnings
        cargo rustc --lib --all-features -- -D warnings
        cargo rustc --bin warp --all-features -- -D warnings
        cargo rustc --lib --no-default-features -- -D warnings
        cargo rustc --test tests --all-features -- -D warnings
      continue-on-error: ${{ startsWith(github.ref, 'refs/heads/claude/') }}
    # `use cmath` reads glibc's math.h, deeper than the macOS one: a test thread's default 2 MB overflowed and aborted
    # every later test (nightly since 10-05, card ci-linux-headers)
    - id: tests
      run: cargo test --verbose --no-fail-fast
      env:
        RUST_MIN_STACK: 33554432
      continue-on-error: ${{ startsWith(github.ref, 'refs/heads/claude/') }}
    # Clippy is denied everywhere: src/, the binary and tests/
    - id: clippy
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo clippy --all-targets --all-features -- -D warnings
        cargo clippy --lib --no-default-features -- -D warnings
      continue-on-error: ${{ startsWith(github.ref, 'refs/heads/claude/') }}
    - name: Agent result
      if: always() && startsWith(github.ref, 'refs/heads/claude/')
      run: |
        result="AGENT_CI_RESULT build=${{ steps.build.outcome }} warnings=${{ steps.warnings.outcome }} clippy=${{ steps.clippy.outcome }} tests=${{ steps.tests.outcome }}"
        echo "$result"
        echo "$result" >> "$GITHUB_STEP_SUMMARY"

# Keeps the `vendor` branch in step with Cargo.lock, so cloud agents can build offline (notes/cloud_offline_build.md).
# Runs only when Cargo.lock changes on main (or by hand); reuses the vendored crates already on the branch and the
# cargo registry cache of the main CI job, and pushes a fast-forward merge commit (no force push).
name: Offline build refresh

on:
  push:
    branches: [ main ]
    paths: [ Cargo.lock ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: vendor

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
    - name: Start from the crates already on the branch
      run: git archive origin/$BRANCH vendor | tar -x
    - name: Vendor exactly what Cargo.lock needs
      run: cargo vendor --config net.offline=false vendor > /dev/null
    - name: Check the offline build from vendor alone
      run: |
        CARGO_HOME=$RUNNER_TEMP/empty_cargo_home cargo build --offline --tests \
          --config 'source.crates-io.replace-with="vendored-sources"' \
          --config 'source.vendored-sources.directory="vendor"'
    - name: Commit main + vendor/ on top of the branch
      run: |
        git config user.name "pannous"
        git config user.email "info@pannous.com"
        export GIT_INDEX_FILE=$RUNNER_TEMP/offline.index
        main=$(git rev-parse HEAD)
        previous=$(git rev-parse origin/$BRANCH)
        git read-tree "$main"
        git -c core.autocrlf=false add -f vendor
        git update-index --add --cacheinfo "100644,$(git hash-object -w notes/cloud_offline_build.md),CLOUD_OFFLINE_BUILD.md"
        tree=$(git write-tree)
        if [ "$tree" = "$(git rev-parse "$previous^{tree}")" ]; then echo "vendor already current"; exit 0; fi
        commit=$(git commit-tree "$tree" -p "$previous" -p "$main" -m "chore(vendor): refresh vendored crates for main ${main:0:8} (automatic, Cargo.lock changed)")
        git push origin "$commit:refs/heads/$BRANCH"

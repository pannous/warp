# .github/workflows/wasmtime-c-api.yml
name: wasmtime C API

# warp's wasmtime C API (crates/wasmtime-c-api, card wasmtime-bundled): wasmtime's C API with the copying collector and
# the GC setters its own lacks, which the native warp (core/native/driver.warp) runs modules on. A tag
# wasmtime-c-api-<version> (the crate's version, wasmtime's) publishes a release with one asset per platform,
# warp-wasmtime-<version>-<target>.tar.gz holding libwarp_wasmtime.dylib / .so / warp_wasmtime.dll; release.yml puts
# the newest one beside warp in every tarball
on:
  push:
    tags: [ "wasmtime-c-api-*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: existing wasmtime-c-api-<version> tag to (re)build the assets for
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: create the release (once)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "warp's wasmtime C API, the copying collector and the GC setters (crates/wasmtime-c-api)"

  library:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-latest, target: aarch64-apple-darwin, file: libwarp_wasmtime.dylib }
        - { os: macos-latest, target: x86_64-apple-darwin, file: libwarp_wasmtime.dylib }
        - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, file: libwarp_wasmtime.so }
        - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, file: libwarp_wasmtime.so }
        - { os: windows-latest, target: x86_64-pc-windows-msvc, file: warp_wasmtime.dll }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: build
      working-directory: crates/wasmtime-c-api
      run: cargo build --release --locked --target ${{ matrix.target }}
    - name: upload
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        archive=warp-wasmtime-${TAG#wasmtime-c-api-}-${{ matrix.target }}.tar.gz
        tar -czf "$archive" -C crates/wasmtime-c-api/target/${{ matrix.target }}/release ${{ matrix.file }}
        gh release upload "$TAG" "$archive" --clobber

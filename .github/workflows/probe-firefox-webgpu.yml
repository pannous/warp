# Probe (cards shaders-firefox, https-pannous; branch shaders only, not merged): the GPU examples of the last Playground
# build of this branch, its playground scripts replaced by this commit's, in Firefox with WebGPU on and in Chrome
name: Probe Firefox WebGPU
on:
  push:
    branches: [ shaders ]
    paths: [ ".github/workflows/probe-firefox-webgpu.yml", "probes/firefox_webgpu/**", "web/playground/*.js", "web/playground/*.mjs", "web/playground/*.py" ]
permissions:
  contents: read
  actions: read
env:
  AGENT_BROWSER_ARGS: --enable-unsafe-webgpu,--enable-unsafe-swiftshader,--use-webgpu-adapter=swiftshader,--enable-features=Vulkan
  FIREFOX_PREFS: "{'dom.webgpu.enabled': true, 'gfx.webgpu.ignore-blocklist': true}"
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ --firefox, --chrome ]
    steps:
    - uses: actions/checkout@v7
    - name: The site of the last Playground build of this branch, with this commit's scripts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --branch shaders --status completed -L 1 --json databaseId -q '.[0].databaseId')
        gh run download "$run" -R "$GITHUB_REPOSITORY" -n site -D _site
        for file in _site/*.js; do [ -f "web/playground/$(basename "$file")" ] && cp "web/playground/$(basename "$file")" "$file"; done
        echo "site of run $run"
    - name: Software Vulkan (lavapipe)
      if: matrix.browser == '--firefox'
      run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
    - name: Install agent-browser (headless Chrome)
      if: matrix.browser == '--chrome'
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: Which program logs the uncaught exception
      if: matrix.browser == '--firefox'
      timeout-minutes: 5
      run: |
        (cd _site && python3 -m http.server 8000 >/dev/null 2>&1 &)
        sleep 2
        probes/firefox_webgpu/variants.sh http://127.0.0.1:8000/ || true
    - name: The GPU examples
      timeout-minutes: 10
      run: python3 web/playground/test_in_browser.py --examples $([ "${{ matrix.browser }}" = --firefox ] && echo --firefox) --site _site shader "(many GPU jobs in one run)" "(the on frame shader samples keep painting)" || true

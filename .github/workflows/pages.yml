# .github/workflows/pages.yml
name: Playground

# The browser playground (web/playground, notes/web_playground.md) on GitHub Pages, custom domain warp.pannous.com:
# the self-hosted compiler warp.wasm with its lib/ (warp-lib/: this checkout's, built by scripts/ci-compilers.sh,
# web/playground/build.sh), the page and samples/<chapter>/*.warp. scripts/browser-dry-run.sh runs the same tours on
# pannous.com.
# Stage 2 of 2 : the Integrator pushes main after the native gate (stage 1) and never waits for this.
# Every push to main that changes the compiler, the page or the samples is built and deployed at once (
# GitHub's hourly cron ran only every few hours, the site lagged main by half a day); the hourly schedule stays as a
# fallback; by hand (`gh workflow run Playground -R pannous/warp`) for a branch check. A failure keeps the last good
# site up and is fixed forward.
on:
  push:
    branches: [main]
    paths: [core/**, lib/**, web/playground/**, samples/**, scripts/ci-compilers.sh, .github/workflows/pages.yml]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      runner:
        # validate the next image before ubuntu-latest moves to it: `gh workflow run … --ref <branch> -f runner=ubuntu-26.04`
        description: the runner image to run on
        default: ubuntu-latest
      skip_checks:
        # publish at once, the tours and suites skipped (user: an urgent fix must be live in a minute):
        # `gh workflow run pages.yml --ref main -f skip_checks=true`
        description: deploy right after the build, without tours and test suites
        type: boolean
        default: false

permissions:
  contents: read
  # the hourly run reads the last green run's commit (job changed)
  actions: read
  pages: write
  id-token: write

env:
  # the runner has no GPU: headless Chrome gets SwiftShader's software WebGPU adapter, else samples/graphics/webgpu logs
  # "No available adapters." and the tour refuses the deploy
  AGENT_BROWSER_ARGS: --enable-unsafe-webgpu,--enable-unsafe-swiftshader,--use-webgpu-adapter=swiftshader,--enable-features=Vulkan

jobs:
  # the hourly run builds only when main changed what the site is made of since the last green run; a dispatch always
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.since.outputs.run }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: since
      env:
        GH_TOKEN: ${{ github.token }}
        SITE_PATHS: core lib web/playground samples scripts/ci-compilers.sh .github/workflows/pages.yml
      run: |
        if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        green=$(gh run list -R "$GITHUB_REPOSITORY" -w Playground -b main -s success -L 1 --json headSha -q '.[0].headSha')
        echo "last green run: ${green:-none}, now: $GITHUB_SHA"
        if [ -n "$green" ] && git cat-file -e "$green" 2>/dev/null && git diff --quiet "$green" HEAD -- $SITE_PATHS; then
          echo "run=false"; else echo "run=true"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    # the compiler the page runs is this checkout's (scripts/ci-compilers.sh, as the Release workflow builds it): the
    # last release's warp.wasm dropped the rules of a newer lib/ it serves (card safari-painting-checks)
    - name: This checkout's compilers
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        scripts/ci-compilers.sh . "$RUNNER_TEMP/bootstrap"
    # the registry's packages, which samples use by path (scripts/link-packages.sh locally)
    - name: The packages
      run: git clone -q --depth 1 https://github.com/pannous/warp-packages.git packages
    # the samples' generated assets, which git ignores: ez_forest's and tree_study's tree meshes and atlas
    - name: The samples' assets
      run: scripts/sample-assets.sh fetch
    - name: Build the compiler folder and samples.js
      run: web/playground/build.sh --lib "$PWD/lib"
    # the same collection as scripts/browser-dry-run.sh's (build.sh collect_site)
    - name: Collect the site
      run: web/playground/build.sh --lib "$PWD/lib" site _site
    - uses: actions/upload-pages-artifact@v5
      with:
        path: _site
    # the tour jobs check this very site, in parallel : Chrome and Firefox each take minutes
    - uses: actions/upload-artifact@v7
      with:
        name: site
        path: _site
        retention-days: 1

  # the one gate of a deploy, on every run but an urgent one: the tour's first example shows its value in headless
  # Chrome, so a page whose hello throws is never deployed (pushes deployed one for an hour: card pages-ci)
  hello:
    needs: build
    if: ${{ !inputs.skip_checks }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Install agent-browser (headless Chrome)
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: The tour's hello shows its value in headless Chrome
      run: python3 web/playground/test_in_browser.py --examples hello --site _site

  # every tour example shows what it promises (examples.js) and no example or sample writes an error or warning to the
  # console, in the collected site, else no deploy
  tour-chrome:
    needs: build
    if: ${{ !inputs.skip_checks && github.event_name != 'push' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Install agent-browser (headless Chrome)
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: The tour in headless Chrome
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # api.github.com's limit for samples/web/live_region (console_watch.mjs)
      run: python3 web/playground/test_in_browser.py --examples --site _site

  # the same in headless Firefox: the runner's own, driven by firefox_driver.mjs
  tour-firefox:
    needs: build
    if: ${{ !inputs.skip_checks && github.event_name != 'push' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Software Vulkan for Firefox's WebGPU (lavapipe)
      run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
    - name: The tour in headless Firefox
      # a run takes about 3 minutes; a stuck one fails loudly instead of holding the deploy (card deploy-firefox-hang)
      # a failed first attempt runs again once, loudly (card tour-firefox-stall: an intermittent worker-start stall in
      # Firefox); a real bug fails both
      timeout-minutes: 25
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # api.github.com's limit for samples/web/live_region (firefox_driver.mjs)
        # Linux Firefox keeps WebGPU off; on lavapipe it runs the GPU samples as the user's Firefox does (card shaders-firefox)
        FIREFOX_PREFS: "{'dom.webgpu.enabled': true, 'gfx.webgpu.ignore-blocklist': true}"
      run: |
        set -o pipefail
        tour() { python3 web/playground/test_in_browser.py --examples --firefox --site _site 2>&1 | tee "$1"; }
        tour first-attempt.log && exit 0
        # `|| true`: under the step's bash -e and pipefail, a first attempt without a stall line (grep finds nothing)
        # ended the step here, so the second attempt never ran (Playground run 38856999410)
        stall=$(grep -o "gave no sign for [^:]*" first-attempt.log | head -1 || true)
        echo "::warning title=Firefox tour failed once, running it again::${stall:-the first attempt is in the log above} (card tour-firefox-stall)"
        tour second-attempt.log

  # the painting checks in Safari on a macOS runner (card webgpu-safari: samples/graphics/webgpu ran Safari out of memory). The
  # runner's Safari has navigator.gpu but no adapter, so the GPU samples show their no-adapter error. Beside the deploy,
  # not before it: macOS runners queue longer
  tour-safari:
    needs: build
    if: ${{ !inputs.skip_checks && github.event_name != 'push' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Allow remote automation
      run: sudo safaridriver --enable
    - name: The painting checks in Safari
      run: python3 web/playground/test_in_browser.py --examples --safari --site _site webgpu shader_trails "(the view's size stays as paintings of that size are shown)" "(many GPU jobs in one run)" "(many tasks in one run)" async "(named GPU arrays, a shader painted into the page's canvas)"

  # only main may deploy (the github-pages environment). The deploy follows the build and its hello; the tours run
  # beside it as checks whose failures are fixed forward, never a gate (a red tour held every deploy for a day)
  # A push runs no tour, so pushes every few minutes don't queue browser runs; verify checks its live hello. Deploys
  # run one at a time per ref, never cancelled: GitHub keeps one pending deploy, the newest, so the site follows main's
  # latest push. An urgent run (skip_checks) deploys without the hello
  deploy:
    needs: [build, hello]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.hello.result != 'failure' }}
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5

  # the same check against the deployed page: its console stays clean too (card console-errors); a push checks its
  # hello only, red when the live page shows another value (card pages-ci)
  verify:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    # the built files: the check waits until the live site serves every one of them, not a CDN's mix of old and new
    # (card playground-verify)
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Install agent-browser
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: The live playground shows the tour (a push its hello) and its console stays clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 web/playground/test_in_browser.py --examples ${{ github.event_name == 'push' && 'hello' || '' }} --url https://warp.pannous.com/ --site _site
    # the page is deployed by now: a Firefox failure here (the intermittent worker-start hang, card firefox-hello) is a
    # warning annotation on the run, not a failed run mailing the user
    - name: The same in headless Firefox (a warning, not a failure)
      if: github.event_name != 'push'
      timeout-minutes: 15
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 web/playground/test_in_browser.py --examples --firefox --url https://warp.pannous.com/ --site _site ||
          echo "::warning title=Firefox check of the live playground failed::see this step's log (card firefox-hello)"

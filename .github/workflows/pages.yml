# .github/workflows/pages.yml
name: Playground

# The browser playground (web/playground, notes/web_playground.md) on GitHub Pages, custom domain warp.pannous.com:
# the warp compiler built for wasm32-unknown-unknown without the native feature (warp.wasm optimized, warp.debug.wasm
# with names and line tables: ?debug), the page, samples/<chapter>/*.warp and the jco-transpiled components (components.js).
# Stage 2 of 2 (user 2026-10-15): the Integrator pushes main after the native gate (stage 1) and never waits for this.
# Hourly, the latest main is built, checked in the browsers and deployed, if it changed the compiler, the page or the
# samples since the last green run; by hand at once (`gh workflow run Playground -R pannous/warp`) for an urgent fix or
# a branch check. A failure keeps the last good site up and is fixed forward.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      runner:
        # validate the next image before ubuntu-latest moves to it: `gh workflow run … --ref <branch> -f runner=ubuntu-26.04`
        description: the runner image to run on
        default: ubuntu-latest

permissions:
  contents: read
  # the hourly run reads the last green run's commit (job changed)
  actions: read
  pages: write
  id-token: write

# one group per ref: an integrator's check of a branch (`gh workflow run Playground --ref <branch>`) and a deploy of main
# don't cancel each other
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: false
  # the runner has no GPU: headless Chrome gets SwiftShader's software WebGPU adapter, else samples/graphics/webgpu logs
  # "No available adapters." and the tour refuses the deploy
  AGENT_BROWSER_ARGS: --enable-unsafe-webgpu,--enable-unsafe-swiftshader,--use-webgpu-adapter=swiftshader,--enable-features=Vulkan

jobs:
  # the hourly run builds only when main changed what the site is made of since the last green run; a dispatch always
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.since.outputs.run }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: since
      env:
        GH_TOKEN: ${{ github.token }}
        SITE_PATHS: src crates web/playground samples Cargo.toml Cargo.lock .github/workflows/pages.yml
      run: |
        if [ "${{ github.event_name }}" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        green=$(gh run list -R "$GITHUB_REPOSITORY" -w Playground -b main -s success -L 1 --json headSha -q '.[0].headSha')
        echo "last green run: ${green:-none}, now: $GITHUB_SHA"
        if [ -n "$green" ] && git cat-file -e "$green" 2>/dev/null && git diff --quiet "$green" HEAD -- $SITE_PATHS; then
          echo "run=false"; else echo "run=true"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-playground-${{ hashFiles('**/Cargo.lock') }}
    - name: Install wasm-opt
      run: sudo apt-get install -y binaryen
    - name: Install jco (build.sh components)
      run: npm install -g @bytecodealliance/jco
    - name: "Install wasm-tools (build.sh components: the WIT signatures)"
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools
    - name: Build the compiler, samples.js and the components
      run: web/playground/build.sh
    # the same collection as scripts/browser-dry-run.sh's (build.sh collect_site)
    - name: Collect the site
      run: web/playground/build.sh site _site
    - uses: actions/upload-pages-artifact@v5
      with:
        path: _site
    # the tour jobs check this very site, in parallel (user 2026-10-09): Chrome and Firefox each take minutes
    - uses: actions/upload-artifact@v7
      with:
        name: site
        path: _site
        retention-days: 1

  # a branch check runs the browser suite only when the branch changes code or tests (docs-only branches skip it);
  # main always runs it
  scope:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      suite: ${{ steps.changes.outputs.suite }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: changes
      run: |
        if [ "$GITHUB_REF" = refs/heads/main ]; then echo "suite=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        changed=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
        echo "$changed"
        if grep -qE "$SUITE_PATHS" <<< "$changed"; then echo "suite=true"; else echo "suite=false"; fi >> "$GITHUB_OUTPUT"
      env:
        SUITE_PATHS: ^(src/|tests/|web/|crates/|Cargo\.|\.cargo/|\.github/workflows/pages\.yml)

  # the whole test suite in headless Chrome (cargo browser-test, notes/web_playground.md): browser tests run in CI only
  # (user 2026-10-09). Beside the deploy, not before it: a failure shows in the run without holding the page back.
  # Four shards of every 4th test, each running one test per core (user 2026-10-10: one job took 21 min)
  browser-suite:
    needs: scope
    if: needs.scope.outputs.suite == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    name: browser-suite (${{ matrix.shard }}/4)
    env:
      WARP_BROWSER_TEST_SHARD: ${{ matrix.shard }}/4
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-browser-suite-${{ hashFiles('**/Cargo.lock') }}
    - name: Install jco (build.sh components, for the `use wasm` tests)
      run: npm install -g @bytecodealliance/jco
    - name: "Install wasm-tools (build.sh components: the WIT signatures)"
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools
    - name: Install agent-browser (headless Chrome)
      run: npm install -g agent-browser && agent-browser install --with-deps
    # the browser cannot run git: the packages, fetched by a native debug warp as `use` fetches them (card build-sh:
    # warp reads packages.warp and the default registry itself, no regex reader)
    - name: Fetch the packages
      run: cargo fetch && web/playground/build.sh pinned
    - name: The test suite in headless Chrome
      run: cargo browser-test

  # every tour example shows what it promises (examples.js) and no example or sample writes an error or warning to the
  # console, in the collected site, else no deploy
  tour-chrome:
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Install agent-browser (headless Chrome)
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: The tour in headless Chrome
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # api.github.com's limit for samples/web/live_region (console_watch.mjs)
      run: python3 web/playground/test_in_browser.py --examples --site _site

  # the same in headless Firefox: the runner's own, driven by firefox_driver.mjs
  tour-firefox:
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Software Vulkan for Firefox's WebGPU (lavapipe)
      run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
    - name: The tour in headless Firefox
      # a run takes about 3 minutes; a stuck one fails loudly instead of holding the deploy (card deploy-firefox-hang)
      # a failed first attempt runs again once, loudly (card tour-firefox-stall: an intermittent worker-start stall in
      # Firefox); a real bug fails both
      timeout-minutes: 25
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # api.github.com's limit for samples/web/live_region (firefox_driver.mjs)
        # Linux Firefox keeps WebGPU off; on lavapipe it runs the GPU samples as the user's Firefox does (card shaders-firefox)
        FIREFOX_PREFS: "{'dom.webgpu.enabled': true, 'gfx.webgpu.ignore-blocklist': true}"
      run: |
        set -o pipefail
        tour() { python3 web/playground/test_in_browser.py --examples --firefox --site _site 2>&1 | tee "$1"; }
        tour first-attempt.log && exit 0
        # `|| true`: under the step's bash -e and pipefail, a first attempt without a stall line (grep finds nothing)
        # ended the step here, so the second attempt never ran (Playground run 38856999410)
        stall=$(grep -o "gave no sign for [^:]*" first-attempt.log | head -1 || true)
        echo "::warning title=Firefox tour failed once, running it again::${stall:-the first attempt is in the log above} (card tour-firefox-stall)"
        tour second-attempt.log

  # the painting checks in Safari on a macOS runner (card webgpu-safari: samples/graphics/webgpu ran Safari out of memory). The
  # runner's Safari has navigator.gpu but no adapter, so the GPU samples show their no-adapter error. Beside the deploy,
  # not before it: macOS runners queue longer
  tour-safari:
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Allow remote automation
      run: sudo safaridriver --enable
    - name: The painting checks in Safari
      run: python3 web/playground/test_in_browser.py --examples --safari --site _site webgpu shader_trails "(the view's size stays as paintings of that size are shown)" "(many GPU jobs in one run)" "(many tasks in one run)" async "(named GPU arrays, a shader painted into the page's canvas)"

  # only main may deploy (the github-pages environment); a branch check (workflow_dispatch on batchNN) ends after the
  # tours, green, instead of a failed deploy mailing a failed run
  deploy:
    needs: [ tour-chrome, tour-firefox ]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5

  # the same check against the deployed page: its console stays clean too (card console-errors)
  verify:
    needs: deploy
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    # the built files: the check waits until the live site serves every one of them, not a CDN's mix of old and new
    # (card playground-verify)
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: _site
    - name: Install agent-browser
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: The live playground shows the tour and its console stays clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 web/playground/test_in_browser.py --examples --url https://warp.pannous.com/ --site _site
    # the page is deployed by now: a Firefox failure here (the intermittent worker-start hang, card firefox-hello) is a
    # warning annotation on the run, not a failed run mailing the user (user 2026-10-09: "conditionally skip the tests")
    - name: The same in headless Firefox (a warning, not a failure)
      timeout-minutes: 15
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 web/playground/test_in_browser.py --examples --firefox --url https://warp.pannous.com/ --site _site ||
          echo "::warning title=Firefox check of the live playground failed::see this step's log (card firefox-hello)"

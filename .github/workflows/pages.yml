# .github/workflows/pages.yml
name: Playground

# The browser playground (web/playground, notes/web_playground.md) on GitHub Pages, custom domain warp.pannous.com:
# the warp compiler built for wasm32-unknown-unknown without the native feature (warp.wasm optimized, warp.debug.wasm
# with names and line tables: ?debug), the page, samples/*.warp and the jco-transpiled components (components.js).
# Deploys on a push to main that changes the compiler, the page or the samples, and by hand
# (`gh workflow run Playground -R pannous/warp`).
on:
  push:
    branches: [ main ]
    paths: [ "src/**", "web/playground/**", "samples/**", "Cargo.toml", "Cargo.lock", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one group per ref: an integrator's check of a branch (`gh workflow run Playground --ref <branch>`) and a deploy of main
# don't cancel each other
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: false
  # the runner has no GPU: headless Chrome gets SwiftShader's software WebGPU adapter, else samples/webgpu logs
  # "No available adapters." and the tour refuses the deploy
  AGENT_BROWSER_ARGS: --enable-unsafe-webgpu,--enable-unsafe-swiftshader,--use-webgpu-adapter=swiftshader,--enable-features=Vulkan
  SITE_FILES: index.html playground.css playground.js deploy.js assistant.js completion.js shortcuts.js entities.tsv guide.js guide.md guide-expert.md primer.md markup.js markup-transitions.js worker.js task-worker.js coi-serviceworker.js host.js host-*.js components.js components foreign_python.py reader.js imports.js examples.js codemirror-warp-mode.js codemirror lib warp.wasm warp.debug.wasm samples.js keywords.js version.js

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-playground-${{ hashFiles('**/Cargo.lock') }}
    - name: Install wasm-opt
      run: sudo apt-get install -y binaryen
    - name: Install jco (build.sh components)
      run: npm install -g @bytecodealliance/jco
    - name: "Install wasm-tools (build.sh components: the WIT signatures)"
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools
    - name: Build the compiler, samples.js and the components
      run: web/playground/build.sh
    - name: Collect the site
      run: |
        mkdir _site
        (cd web/playground && cp -r $SITE_FILES ../../_site/)
        # the language primer for agents at the conventional path (llmstxt.org)
        cp web/playground/primer.md _site/llms.txt
        # every host part the worker imports (host.js HOST_PART_FILES) is shipped, else no deploy
        for part in $(grep -o '"host-[a-z]*\.js"' web/playground/host.js | tr -d '"'); do test -f _site/$part || { echo "::error::$part missing from the site"; exit 1; }; done
        # the C module the tour imports (examples.js "C libraries"), at its repository path: the page's file root is the site
        mkdir -p _site/tests/fixtures/wasm && cp tests/fixtures/wasm/zlib.wasm tests/fixtures/wasm/zlib.h _site/tests/fixtures/wasm/
        # the warp-compiled module samples/import_compiled.warp imports by its bare name (samples/shapes.wasm links it)
        mkdir -p _site/samples && cp tests/fixtures/compiled/shapes.wasm _site/samples/
        echo "warp.pannous.com" > _site/CNAME
        # the files the site serves, so the compiler asks only for those (host-files.js): no 404 in the console
        web/playground/build.sh served _site
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    # the tour jobs check this very site, in parallel (user 2026-10-09): Chrome and Firefox each take minutes
    - uses: actions/upload-artifact@v4
      with:
        name: site
        path: _site
        retention-days: 1

  # a branch check runs the browser suite only when the branch changes code or tests (docs-only branches skip it);
  # main always runs it
  scope:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.changes.outputs.suite }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: changes
      run: |
        if [ "$GITHUB_REF" = refs/heads/main ]; then echo "suite=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        changed=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
        echo "$changed"
        if grep -qE "$SUITE_PATHS" <<< "$changed"; then echo "suite=true"; else echo "suite=false"; fi >> "$GITHUB_OUTPUT"
      env:
        SUITE_PATHS: ^(src/|tests/|web/|crates/|Cargo\.|\.cargo/|\.github/workflows/pages\.yml)

  # the whole test suite in headless Chrome (cargo browser-test, notes/web_playground.md): browser tests run in CI only
  # (user 2026-10-09). Beside the deploy, not before it: a failure shows in the run without holding the page back.
  # Four shards of every 4th test, each running one test per core (user 2026-10-10: one job took 21 min)
  browser-suite:
    needs: scope
    if: needs.scope.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    name: browser-suite (${{ matrix.shard }}/4)
    env:
      WARP_BROWSER_TEST_SHARD: ${{ matrix.shard }}/4
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-browser-suite-${{ hashFiles('**/Cargo.lock') }}
    - name: Install jco (build.sh components, for the `use wasm` tests)
      run: npm install -g @bytecodealliance/jco
    - name: "Install wasm-tools (build.sh components: the WIT signatures)"
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools
    - name: Install agent-browser (headless Chrome)
      run: npm install -g agent-browser && agent-browser install --with-deps
    # the browser cannot run git: each pinned package of packages.warp is fetched as the native fetch_package does
    # (src/modules.rs): its version tag cloned once into the package cache, linked as packages/<name>
    - name: Fetch the pinned packages
      run: |
        grep -oE '^[a-z_]+: \{repository: "[^"]+", version: [0-9.]+\}' packages.warp | while read -r pinned; do
          name=${pinned%%:*}
          url=$(grep -oE 'https://[^"]+' <<< "$pinned")
          version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<< "$pinned")
          tag=$(git ls-remote --tags --refs "$url" | grep -oE "refs/tags/v?$version\$" | sed 's|refs/tags/||' | head -1)
          cached=~/.cache/warp/packages/$name@$version
          git clone -q --depth 1 --branch "$tag" "$url" "$cached"
          mkdir -p packages && ln -s "$cached" "packages/$name"
        done
        ls -l packages
    - name: The test suite in headless Chrome
      run: cargo browser-test

  # every tour example shows what it promises (examples.js) and no example or sample writes an error or warning to the
  # console, in the collected site, else no deploy
  tour-chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: site
        path: _site
    - name: Install agent-browser (headless Chrome)
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: The tour in headless Chrome
      run: python3 web/playground/test_in_browser.py --examples --site _site

  # the same in headless Firefox: the runner's own, driven by firefox_driver.mjs
  tour-firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: site
        path: _site
    - name: The tour in headless Firefox
      # a run takes about 3 minutes; a stuck one fails loudly instead of holding the deploy (card deploy-firefox-hang)
      timeout-minutes: 15
      run: python3 web/playground/test_in_browser.py --examples --firefox --site _site

  # only main may deploy (the github-pages environment); a branch check (workflow_dispatch on batchNN) ends after the
  # tours, green, instead of a failed deploy mailing a failed run
  deploy:
    needs: [ tour-chrome, tour-firefox ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4

  # the same check against the deployed page: its console stays clean too (card console-errors)
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install agent-browser
      run: npm install -g agent-browser && agent-browser install --with-deps
    - name: The live playground shows the tour and its console stays clean
      run: python3 web/playground/test_in_browser.py --examples --url https://warp.pannous.com/
    # the page is deployed by now: a Firefox failure here (the intermittent worker-start hang, card firefox-hello) is a
    # warning annotation on the run, not a failed run mailing the user (user 2026-10-09: "conditionally skip the tests")
    - name: The same in headless Firefox (a warning, not a failure)
      timeout-minutes: 15
      run: |
        python3 web/playground/test_in_browser.py --examples --firefox --url https://warp.pannous.com/ ||
          echo "::warning title=Firefox check of the live playground failed::see this step's log (card firefox-hello)"

# cargo install --path . --locked --offline
# Offline builds: avoids the ~10 s registry update on every compile
# --offline mode: dependencies come from the local registry cache. Vendoring is deactivated for now (no vendor/ on main;
# the `vendor` branch and its refresh workflow are kept for offline cloud agents: notes/cloud_offline_build.md)


# crates/warp-runtime: running compiled programs without the compiler; its binary is the stub of `warp build --exe`
[workspace]
members = ["crates/warp-runtime"]
resolver = "2"

[package]
name = "warp-lang" # crates.io: `warp` is the web framework (user 2026-10-06: "lang is perfect"); the library stays `warp`
version = "1.2.3"
edition = "2021"  # Cargo edition! NOT package edition!
description = "Warp: the Wasp language, a data notation that is also a programming language, compiled to WebAssembly GC"
repository = "https://github.com/pannous/warp"
homepage = "https://warp.pannous.com/"
readme = "README.md"
keywords = ["wasm", "webassembly", "language", "compiler", "notation"]
categories = ["compilers", "wasm", "command-line-utilities"]
# the published crate: the sources and the two files they include_str!, not the tests, wiki or playground
include = ["src/**", "packages.wasp", "web/playground/foreign_python.py", "README.md"]
# One test binary: cargo would otherwise build and link every tests/*.rs as its own crate (~200 links)
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[[bin]]
name = "warp"
path = "src/main.rs"
required-features = ["native"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Zero warnings: these warn locally and CI denies them and every clippy lint (rust.yml steps "warnings" and "clippy").
# Fix or delete the code instead of a crate-level #![allow(...)].
[lints.rust]
unused = "warn"
dead_code = "warn"
unreachable_code = "warn"
deprecated = "warn"

[features]
# native: running programs (wasmtime), the network, FFI and the console; off for the compiler-in-the-browser build (web/playground)
default = ["native", "validate"]
native = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:sha2", "dep:flate2", "dep:crc32fast", "warp-runtime/compiler", "dep:ureq", "dep:rustyline", "dep:libloading", "dep:wat", "dep:regex"]
# validate: check every emitted module with wasmparser's validator (a compiler bug becomes an internal error); a quarter
# of the browser build, whose engine validates anyway: web/playground/build.sh leaves it out of the optimized warp.wasm
validate = []
#test = [] superfluous, just use cargo test => #[cfg(test)]
optimizer = [] # Enable optimizing wasm via ...
ffi = []  # Enable FFI tests (requires native libraries like libc/libm)

[dependencies]
# ⚠️ toggle OFFLINE mode!
# can't exclude dependencies from test, only with features
anyhow = "1.0"
#regex = "1.10.3" # removed: unused
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
#wast = "*"
wasmparser = "0.259"
wat = { version = "1.259", optional = true } # native: an imported module may be WAT text (wasm_modules.rs)
wasm-encoder = { version = "0.259", features = ["wasmparser"] } # wasmparser: reencode, for dead_functions.rs
log = "0.4.29"
#fetch = "0.8.1"
num-bigint = { version = "0.4.8", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
ureq = { version = "3.1.4", optional = true }
regex = { version = "1.12", optional = true } # the stdlib module regex natively (src/std_adapters.rs); JS RegExp in the browser
paste = "1.0"
rustyline = { version = "18", optional = true }
libloading = { version = "0.9", optional = true }  # Dynamic library loading for FFI (raylib, SDL2, etc.)

# syn and reqwest removed - treeshaking

#wasm-bindgen = "0.2.91"

#wasmer = "4.2.5"
#wasmedge-sdk = "0.13.2" BROKEN!

#binaryen = "*" # 0.12.0 C++ compiler and toolchain infrastructure library for WebAssembly.
#It exposes an API for parsing and generating WebAssembly modules, and a set of tools for interacting with them.
#wabt = "0.2.0" # C++ WebAssembly Binary Toolkit, exposes only wasm2wat wat2wasm DEAD (2023-02)

wasmtime = { version = "49.0.1", default-features = false, features = ["anyhow", "cranelift", "gc", "gc-copying", "runtime", "wat"], optional = true }
wasmtime-wasi = { version = "49.0.1", optional = true }
warp-runtime = { path = "crates/warp-runtime", version = "1.2.3", default-features = false } # without features: the names of the host words only
flate2 = { version = "1.1", optional = true } # paint() writes a PNG natively (src/paint.rs); in the tree through wasmtime already
crc32fast = { version = "1.5", optional = true } # the PNG chunk checksums
sha2 = { version = "0.10", optional = true } # keys the compiled-module cache (src/run/module_cache.rs); wasmtime uses it already
#wasmtime-runtime = "*" # Wasmtime runtime
#wasmtime-wasi = "*" # WASI support for Wasmtime
#wasmtime-wast = "*" # Wast support for Wasmtime
#wasmtime-environ = "*" # Wasmtime environment
#wasmtime-obj = "*" # Wasmtime object file
#wasmtime-objdump = "*" # Wasmtime object file dumper
#wasmtime-profiling = "*" # Wasmtime profiling
#wasmtime-wasi-common = "*" # WASI common support for Wasmtime
#wasmtime-jit = "*" # JIT compiler for Wasmtime
#wasmtime-wiggle = "*" # Wiggle support for Wasmtime

#wasm-builder = "*" #Wasm builder is a utility for building a rust project as a Wasm binary

#parity-wasm = "*" # Low-level WebAssembly format library for serializing, deserializing, and building .wasm binaries.
#Good support for well-known custom sections, such as the "names" section and "reloc.WHATEVER" sections.
# parity-wasm is INCOMPLETE: pub enum Type { Function(FunctionType),

#[test-dependencies] no such thing. it's :
[dev-dependencies]
# only compiled and included when running tests or examples
wat = "1.259" # tests build modules from WAT text


[profile.dev]
incremental = true
# Maximum build speed optimizations
opt-level = 0          # No optimization for faster compile
#debug = 0              # Minimal debug info for faster compile (override with CARGO_PROFILE_DEV_DEBUG=true)
#debug = false         # fast by default (IDE overrides with CARGO_PROFILE_DEV_DEBUG=true or use [profile.fast])
debug = true           # IDE needs debug symbols for breakpoints
split-debuginfo = "unpacked"  # Faster on macOS
codegen-units = 16     # Rust default (256 was wasteful)

# tests run the programs on wasmtime too: its GC at full speed (two million map entries took 40 s unoptimized)
[profile.dev.package.wasmtime]
opt-level = 3
# every run compiles its module with Cranelift: unoptimized, it took 118 of the 122 s of a functions:: test run
# (581 modules, 200 ms each); at opt-level 3 the run takes 15 s
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.test]
inherits = "dev"       # Use dev profile for tests

# don't use for now to see if it helps with IDEs using same build cache
#[profile.fast]
#inherits = "dev"
#debug = false          # No debug symbols → /opt/cargo/fast/

# web/playground's warp.debug.wasm: optimized enough to run, with DWARF and the name section kept for the browser's
# debugger and readable stack traces (build.sh)
[profile.web-debug]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
debug = "line-tables-only" # full DWARF is 53 MB; lines and function names are what the debugger and traces need
strip = false

[profile.release]
incremental = false    # Release doesn't need incremental
opt-level = "z"        # Optimize for size
lto = true             # Full LTO for maximum treeshaking
codegen-units = 1      # Single codegen unit for best optimization
panic = "abort"        # Smaller binary, no unwinding
strip = true           # Strip symbols

# the native runtime runs the programs: its GC and libcalls at full speed (a size-optimized wasmtime ran a GC-heavy
# map program 2.5× slower than the wasmtime CLI); the web build has no wasmtime, so its size is untouched
[profile.release.package.wasmtime]
opt-level = 3

[lib]
name = "warp"
# Only rlib: the browser build asks for the cdylib itself (web/playground/build.sh: `cargo rustc --crate-type cdylib`).
# A cdylib here made cargo name the rlib without a hash, so every checkout copy linked the same libwarp.rlib.
crate-type = ["rlib"]
